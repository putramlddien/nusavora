{% extends "accounts/base_accounts.html" %}
{% load static %}
{% block content %}

<section class="bg-white">
  <div
    class="container flex items-center justify-center min-h-screen px-6 mx-auto"
  >
    <form
      method="POST"
      class="w-full max-w-md bg-white p-6 rounded-lg shadow-md"
    >
      {% csrf_token %}

      <div class="flex justify-center mx-auto mb-4">
        <img
          class="w-auto h-7 sm:h-8"
          src="{% static 'images/nusavora_black_logo.png' %}"
          alt="Mojura Resto Logo"
        />
      </div>

      <h2 class="text-center text-lg font-semibold text-gray-700 mb-2">
        Verifikasi OTP
      </h2>
      <p class="text-sm text-center text-gray-500 mb-6">
        Kode OTP telah dikirim ke email
        <span class="font-medium">{{ email }}</span>.
      </p>

      {% if error %}
      <div class="mb-4 text-sm text-red-600 text-center">{{ error }}</div>
      {% endif %}

      <!-- OTP Input -->
      <div class="relative flex items-center">
        <span class="absolute left-3">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-6 h-6 text-gray-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 12H8m0 0l4 4m-4-4l4-4"
            />
          </svg>
        </span>
        <input
          type="text"
          name="otp"
          id="otp"
          maxlength="6"
          pattern="[0-9]{6}"
          placeholder="Masukkan 6 digit kode OTP"
          required
          class="block w-full py-3 pl-12 pr-4 text-gray-700 bg-white border rounded-lg focus:border-blue-400 focus:ring-blue-300 focus:outline-none focus:ring focus:ring-opacity-40"
        />
      </div>

      <div class="mt-6">
        <button
          type="submit"
          class="w-full px-6 py-3 text-sm font-medium tracking-wide text-white bg-blue-500 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-300"
        >
          Verifikasi OTP
        </button>
      </div>
    </form>
  </div>
</section>

{% endblock %}
