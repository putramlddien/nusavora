{% extends "accounts/base_accounts.html" %}
{% load static %}
{% block content%}

<section class="bg-white">
  <div
    class="container flex items-center justify-center min-h-screen px-6 mx-auto"
  >
    <form
      method="POST"
      class="w-full max-w-md bg-white p-6 rounded-lg shadow-md"
    >
      {% csrf_token %}

      <div class="flex justify-center mx-auto mb-8">
        <img
          class="w-auto h-7 sm:h-8"
          src="{% static 'images/nusavora_black_logo.png' %}"
          alt="Nusavora Logo"
        />
      </div>

      <!-- Nav toggle -->
<div class="flex items-center justify-center mt-4 mb-6">
  <!-- Sign In = halaman aktif -->
  <a
    href="#"
    class="w-1/2 pb-2 font-medium text-center text-gray-800 capitalize border-b-2 border-blue-500"
    aria-current="page"
  >
    Sign In
  </a>
  <a
    href="{% url 'customer_register' %}"
    class="w-1/2 pb-2 font-medium text-center text-gray-500 capitalize border-b hover:text-blue-500"
  >
    Sign Up
  </a>
</div>

      <!-- Email -->
      <div class="relative flex items-center mt-4">
        <span class="absolute left-3">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-6 h-6 text-gray-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
            />
          </svg>
        </span>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Email Address"
          value="{{ request.POST.email }}"
          required
          class="block w-full py-3 pl-12 pr-4 text-gray-700 bg-white border rounded-lg dark:border-gray-600 focus:border-blue-400 focus:ring-blue-300 focus:outline-none focus:ring focus:ring-opacity-40"
        />
      </div>

      <!-- Password -->
      <div class="relative flex items-center mt-4">
        <span class="absolute left-3">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-6 h-6 text-gray-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
            />
          </svg>
        </span>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Password"
          required
          class="block w-full py-3 pl-12 pr-4 text-gray-700 bg-white border rounded-lg dark:border-gray-600 focus:border-blue-400 focus:ring-blue-300 focus:outline-none focus:ring focus:ring-opacity-40"
        />
      </div>

      <!-- Submit -->
      <div class="mt-6">
        <button
          type="submit"
          class="w-full px-6 py-3 text-sm font-medium tracking-wide text-white capitalize transition-colors duration-300 transform bg-blue-500 rounded-lg hover:bg-blue-400 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-50"
        >
          Sign In
        </button>
      </div>

      <div class="mt-6 text-center">
        <a
          href="{% url 'customer_register' %}"
          class="text-sm text-blue-500 hover:underline"
        >
          Tidak Punya Akun? Daftar
        </a>
      </div>
    </form>
  </div>
</section>

{% endblock %}
